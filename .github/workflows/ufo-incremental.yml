name: ufo-incremental

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  ufo:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        box: ["5690", "7270", "7490"]
    runs-on: ubuntu-latest
    
    steps:

    - shell: bash
      run: echo DATE=$(date +%F_%R) >> $GITHUB_ENV

    - uses: actions/cache@v5
      with:
        path: |
          ~/
          ./
        key: cache-${{ github.ref_name }}-${{ matrix.box }}-${{ env.DATE }}
        restore-keys: cache-${{ github.ref_name }}-${{ matrix.box }}

    - uses: actions/checkout@v6
      with:
        clean: false

    - run: tools/prerequisites install

    - run: |
        cp config-${{ matrix.box }} .config
        rm images/* || true
        # make kernel-autofix
        # make kernel-dirclean

    - run: make

    - run: |
        grep -v '#  freetz-ng ' .config > config-${{ matrix.box }}
        sed -i 's/^# ... ... .. ..:..:.. ....$/# date removed by ufo/' make/kernel/configs/freetz/config-ur8-7270_06.05

    - uses: EndBug/add-and-commit@v9
      with:
        push: false
        
    - run: git pull --rebase && git push

    - uses: actions/upload-artifact@v6
      with:
        name: incremental-${{ matrix.box }}-${{ github.sha }}
        path: images
        retention-days: 2
