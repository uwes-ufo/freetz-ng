name: ufo-incremental

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  ufo:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        box: ["5690", "7270", "7490"]
    runs-on: ubuntu-latest

    steps:

    - shell: bash
      run: echo DATE=$(date +%F_%R) >> $GITHUB_ENV

    - uses: actions/cache@v5
      id: cache
      with:
        path: |
          ~/
          ./
          !.git/
        key: cache-${{ github.ref_name }}-${{ matrix.box }}-${{ env.DATE }}
        restore-keys: cache-${{ github.ref_name }}-${{ matrix.box }}

    - uses: actions/checkout@v6
      with:
        clean: false

    - run: tools/prerequisites install

    - run: cp config-${{ matrix.box }} .config
    #- run: make kernel-autofix
    #- run: make kernel-dirclean
    #- run: make tools-dirclean

    - run: rm -f images/*

    - run: make

    - run: grep -v '#  freetz-ng ' .config > config-${{ matrix.box }}

    - run: git checkout make/kernel/configs/freetz/config-ur8-7270_06.05 && touch -d 2014-03-27 make/kernel/configs/freetz/config-ur8-7270_06.05

    - run: git commit -am incremental-${{ matrix.box }} && git pull --rebase && git push || true

    - uses: actions/upload-artifact@v7
      with:
        name: incremental-${{ matrix.box }}-${{ github.sha }}
        path: images
        retention-days: 2
