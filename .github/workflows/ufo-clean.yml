name: ufo-clean

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  check-artifact:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '[.artifacts[] | select(.expired == false)] | length')
          echo "exists=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
  
  ufo:
    needs: check-artifact
    if: needs.check-artifact.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        box: ["5690", "7270", "7490"]
    runs-on: ubuntu-24.04
    steps:

    - uses: actions/checkout@v6

    - run: tools/prerequisites install

    - run: cp config-${{ matrix.box }} .config

    - run: make

    - run: grep -v '#  freetz-ng ' .config > config-${{ matrix.box }}

    - run: git checkout make/kernel/configs/freetz/config-ur8-7270_06.05

    - run: git commit -am clean-${{ matrix.box }} && git pull && git push || true

    - uses: actions/upload-artifact@v7
      with:
        name: images-${{ matrix.box }}-${{ github.sha }}
        path: images
        retention-days: 2
