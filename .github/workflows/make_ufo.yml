name: make_ufo

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  build:
    permissions:
      contents: write
    container:
      image: ghcr.io/freetz-ng/firmware
      options: --user 1001:1001
    strategy:
      max-parallel: 7
      fail-fast: false
      matrix:
        box: ["5690", "7270", "7490"]
    runs-on: ubuntu-latest
    
    steps:

      - run: echo "DATE=$(date +%F-%H)" >> $GITHUB_ENV
        
      - uses: actions/cache@v4
        with:
          path: |
            ~/ 
            ./
          key: cache-${{ matrix.box }}-${{ env.DATE }}
          restore-keys: cache-${{ matrix.box }}

      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          set-safe-directory: true
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: ${{ github.workspace }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - shell: bash 
        run: |
          cp config-${{ matrix.box }} .config
          rm images/*
          make
          diff -q <(grep -v '#  freetz-ng ' .config) <(grep -v '#  freetz-ng ' config-${{ matrix.box }}) || cp .config config-${{ matrix.box }}

      - uses: EndBug/add-and-commit@v9

      - run: ls -l images/

      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.box }}
          path: images
          retention-days: 2  
