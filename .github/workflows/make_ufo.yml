name: make_ufo

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  build:
    permissions:
      contents: write
    container:
      image: ghcr.io/freetz-ng/firmware
      options: --user 1001:1001
    strategy:
      max-parallel: 7
      fail-fast: false
      matrix:
        box: ["5690", "7270", "7490"]
    runs-on: ubuntu-latest
    
    steps:

      - uses: actions/cache@v4
        if: always()
        with:
          path: ~/ 
            ./
          key: cache-${{ matrix.box }}-1
          restore-keys: cache-${{ matrix.box }}

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          set-safe-directory: true
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: ${{ github.workspace }}
          fetch-depth: 0
          clean: false
          persist-credentials: true

      - run: C=config-${{ matrix.box }}
          cp $C .config
          make olddefconfig
          P='(#  freetz-ng )([0-9a-f]{10})( ufo .*)'
          H=$(sed -rn "s/$P/\2/p" $C)
          [ "$(diff -q <(sed -r "s/$P/\1\3/" .config) <(sed -r "s/$P/\1\3/" $C))" ] && cp .config $C || sed -r "s/$P/\1$H\3/" .config > $C
          rm images/*

      - uses: EndBug/add-and-commit@v9

      - run: make

      - run: ls -l images/
          sha256sum images/*

      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.box }}
          path: images
          retention-days: 2  
